name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pull requests and main: certificate-free check build (no secrets needed).
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Extension regression tests
        run: node --test tests/extension.test.cjs

      - name: Build (ad-hoc signed)
        run: bash scripts/build.sh

  # Tags vX.Y.Z: Developer ID signed, notarized and stapled release.
  # Required repository secrets (same names as encrypted-memories):
  #   APPLE_SIGNING_CERTIFICATES_P12_BASE64 / APPLE_SIGNING_CERTIFICATES_PASSWORD
  #     -> P12 export of the "Developer ID Application" certificate + key
  #   APP_STORE_CONNECT_ISSUER_ID / APP_STORE_CONNECT_KEY_ID /
  #   APP_STORE_CONNECT_PRIVATE_KEY_BASE64 -> team API key used by notarytool
  notarize:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Extension regression tests
        run: node --test tests/extension.test.cjs

      - name: Import Developer ID certificate
        uses: Apple-Actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          # The default signing_temp keychain gets an auto-generated password.
          p12-file-base64: ${{ secrets.APPLE_SIGNING_CERTIFICATES_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_SIGNING_CERTIFICATES_PASSWORD }}

      - name: Build, sign and notarize
        env:
          MYJD_VERSION: ${{ github.ref_name }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          export MYJD_VERSION="${MYJD_VERSION#v}"
          export APP_STORE_CONNECT_PRIVATE_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode > "$APP_STORE_CONNECT_PRIVATE_KEY_PATH"
          chmod 600 "$APP_STORE_CONNECT_PRIVATE_KEY_PATH"
          bash scripts/release.sh
          rm -f "$APP_STORE_CONNECT_PRIVATE_KEY_PATH"
          cp build/MyJDownloader.zip MyJDownloader.zip

      - name: Upload notarized artifact
        uses: actions/upload-artifact@v7
        with:
          name: MyJDownloader
          path: MyJDownloader.zip

  release:
    needs: notarize
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: MyJDownloader

      # Only the tag-triggered publishing job needs repository write access.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          SHA256=$(sha256sum MyJDownloader.zip | awk '{print $1}')
          gh release create "$GITHUB_REF_NAME" MyJDownloader.zip \
            --title "$GITHUB_REF_NAME" \
            --notes "Universal build, Developer ID signed and notarized by Apple. Install: \`brew install --cask traktuner/tap/jdownloader2-safari\`. SHA256: \`$SHA256\`"
          {
            echo "## Homebrew cask"
            echo "version \"${GITHUB_REF_NAME#v}\""
            echo "sha256 \"$SHA256\""
          } >> "$GITHUB_STEP_SUMMARY"
