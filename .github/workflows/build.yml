name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode version
        run: xcodebuild -version

      - name: Extension regression tests
        run: node --test tests/extension.test.cjs

      # A certificate-free universal build is the default for personal use.
      # Safari requires the user's explicit "Allow Unsigned Extensions" setting.
      - name: Build (ad-hoc signed)
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -o pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export MYJD_VERSION="${RELEASE_REF#v}"
          fi
          bash scripts/build.sh

      - name: Package
        id: package
        run: |
          APP="build/Build/Products/Release/MyJDownloader.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" MyJDownloader.zip
          echo "sha256=$(shasum -a 256 MyJDownloader.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: MyJDownloader
          path: MyJDownloader.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: MyJDownloader

      # Only the tag-triggered publishing job needs repository write access.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          SHA256=$(sha256sum MyJDownloader.zip | awk '{print $1}')
          gh release create "$GITHUB_REF_NAME" MyJDownloader.zip \
            --title "$GITHUB_REF_NAME" \
            --notes "Universal personal-use build (ad-hoc signed). See README for Safari setup. SHA256: \`$SHA256\`"
