name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode version
        run: xcodebuild -version

      # CI builds ad-hoc signed (no Apple certificate). The Homebrew cask
      # re-signs the .app locally with the user's "Apple Development" identity
      # in its postflight, so Safari accepts it without "Allow Unsigned
      # Extensions". See the cask in the personal homebrew tap.
      - name: Build (ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild \
            -project MyJDownloader.xcodeproj \
            -scheme "MyJDownloader" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package
        id: package
        run: |
          APP="build/Build/Products/Release/MyJDownloader.app"
          ditto -c -k --keepParent "$APP" MyJDownloader.zip
          echo "sha256=$(shasum -a 256 MyJDownloader.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          shasum -a 256 MyJDownloader.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyJDownloader
          path: MyJDownloader.zip

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" MyJDownloader.zip \
            --title "$GITHUB_REF_NAME" \
            --notes "Automated ad-hoc build. SHA256: \`${{ steps.package.outputs.sha256 }}\`"
